[package]
name = "banana-leclerc"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = "fat"

[package.metadata.v5]
upload-strategy = "differential"
slot = 2
icon = "cool-x"
compress = true

[dependencies]
autons = "0.2.0"
vexide = { version = "0.8.0", features = ["full", "vex-sdk-vexcode", "vex-sdk-mock"] }
